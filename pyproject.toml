[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-koans"
version = "0.1.0"
description = "Progressive Python koans for learning LLM attention and Transformer internals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
