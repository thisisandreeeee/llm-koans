[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-transformer-koans"
version = "0.1.0"
description = "Progressive PyTorch koans for learning attention and Transformer encoder/decoder architecture."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
